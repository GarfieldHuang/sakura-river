<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>&#8203;</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%23f4a7bb' transform='translate(32 32)'%3E%3Cellipse rx='9' ry='16' cy='-14'/%3E%3Cellipse rx='9' ry='16' cy='-14' transform='rotate(72)'/%3E%3Cellipse rx='9' ry='16' cy='-14' transform='rotate(144)'/%3E%3Cellipse rx='9' ry='16' cy='-14' transform='rotate(216)'/%3E%3Cellipse rx='9' ry='16' cy='-14' transform='rotate(288)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5' fill='%23c2476a'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d0f14;}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab;}
canvas:active{cursor:grabbing;}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(ellipse at 50% 45%,#1b1f2b 0%,#0d0f14 70%);transition:opacity 1.6s ease;z-index:10;pointer-events:none;}
#loader svg{width:92px;height:92px;animation:spin 9s linear infinite;filter:drop-shadow(0 0 18px rgba(244,167,187,.35));}
#loader .p{transform-origin:0 0;animation:breathe 2.6s ease-in-out infinite;}
#track{width:180px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
#bar{width:100%;height:100%;background:linear-gradient(90deg,#f4a7bb,#ffe1e9);transform-origin:0 50%;transform:scaleX(0);transition:transform .5s ease;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
</style>
</head>
<body>
<div id="loader">
<svg viewBox="-50 -50 100 100"><g fill="#f4a7bb" class="p">
<path d="M0,-6 C-12,-18 -12,-36 -4,-44 L0,-38 L4,-44 C12,-36 12,-18 0,-6Z"/>
<path d="M0,-6 C-12,-18 -12,-36 -4,-44 L0,-38 L4,-44 C12,-36 12,-18 0,-6Z" transform="rotate(72)"/>
<path d="M0,-6 C-12,-18 -12,-36 -4,-44 L0,-38 L4,-44 C12,-36 12,-18 0,-6Z" transform="rotate(144)"/>
<path d="M0,-6 C-12,-18 -12,-36 -4,-44 L0,-38 L4,-44 C12,-36 12,-18 0,-6Z" transform="rotate(216)"/>
<path d="M0,-6 C-12,-18 -12,-36 -4,-44 L0,-38 L4,-44 C12,-36 12,-18 0,-6Z" transform="rotate(288)"/>
</g><circle r="6" fill="#c2476a"/><g fill="#f7d774"><circle r="1.4" cy="-10"/><circle r="1.4" cy="-10" transform="rotate(72)"/><circle r="1.4" cy="-10" transform="rotate(144)"/><circle r="1.4" cy="-10" transform="rotate(216)"/><circle r="1.4" cy="-10" transform="rotate(288)"/></g></svg>
<div id="track"><div id="bar"></div></div>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
